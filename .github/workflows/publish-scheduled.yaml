name: Publish scheduled articles

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-scheduled-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Asia/Jakarta
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true

      - name: Publish articles whose schedule has passed
        run: node server/scripts/publish-due.js

      - name: Commit published pages
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- '*.html' blog/index.html blog/managed/index.html
          if git diff --cached --quiet; then
            echo "Nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish scheduled articles"
          git push origin HEAD:main
